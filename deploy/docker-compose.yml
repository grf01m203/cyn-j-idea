# 可选的容器化部署（方案 B）
# 本地开发不需要 Docker；若服务器可安装 Docker，可用本文件一键起 MySQL + Nginx + 应用。
# 用法：
#   cp campus-venue-server/src/main/resources/application-prod.example.yml deploy/application-prod.yml
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d
services:
  mysql:
    image: mysql:8.0
    container_name: campus-venue-mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: campus_venue
      MYSQL_USER: campus
      MYSQL_PASSWORD: ${DB_PASSWORD:-Campus@2026}
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
      - ../docs/sql:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    image: eclipse-temurin:17-jre
    container_name: campus-venue-app
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_USERNAME: campus
      DB_PASSWORD: ${DB_PASSWORD:-Campus@2026}
      CHECKIN_SECRET: ${CHECKIN_SECRET:-change-me-in-production}
      TZ: Asia/Shanghai
    volumes:
      - ../campus-venue-server/target/campus-venue-server.jar:/app/app.jar:ro
      - ./application-prod.yml:/app/application-prod.yml:ro
      - app-data:/app/data
    command: ["java", "-jar", "/app/app.jar", "--spring.profiles.active=prod", "--spring.config.additional-location=/app/"]
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

  nginx:
    image: nginx:1.24
    container_name: campus-venue-nginx
    depends_on:
      - app
    volumes:
      - ./nginx/campus-venue.conf:/etc/nginx/conf.d/default.conf:ro
      - ../campus-venue-uniapp/dist/build/h5:/var/www/campus-venue/h5:ro
      - ../campus-venue-admin/dist:/var/www/campus-venue/admin:ro
    ports:
      - "80:80"
    restart: unless-stopped

volumes:
  mysql-data:
  app-data:
