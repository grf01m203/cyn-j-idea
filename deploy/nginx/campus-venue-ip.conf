# Nginx 配置：IP 直连模式（无域名 / 未备案时使用）
# 适用：阿里云免费试用 ECS（不支持备案）、或临时演示
# 放置位置：/etc/nginx/conf.d/campus-venue.conf
# 访问方式：http://<公网IP>/          —— 学生端 H5
#           http://<公网IP>/admin/    —— 管理端
#           http://<公网IP>/api/...   —— 后端接口（由 Nginx 反代到 8080）
# 说明：IP 直连无法申请 Let's Encrypt 证书（CA 不给裸 IP 签发），
#       因此本模式下使用 HTTP；如需 HTTPS，请改用已备案域名 + campus-venue.conf。

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 10m;
    access_log /var/log/nginx/campus-venue.access.log;
    error_log  /var/log/nginx/campus-venue.error.log;

    # ---------- 学生端 H5（uni-app 构建产物）----------
    root /var/www/campus-venue/h5;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- 管理端（子路径部署）----------
    location /admin/ {
        alias /var/www/campus-venue/admin/;
        try_files $uri $uri/ /admin/index.html;
    }

    # ---------- 后端 API ----------
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ---------- WebSocket（多端实时消息；校园网/4G 下同样可用）----------
    location /ws/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_read_timeout 3600s;
    }

    # ---------- 接口文档（演示用，可关闭）----------
    location /doc.html    { proxy_pass http://127.0.0.1:8080; }
    location /webjars/    { proxy_pass http://127.0.0.1:8080; }
    location /v3/api-docs { proxy_pass http://127.0.0.1:8080; }

    # ---------- 上传文件（本地磁盘）----------
    location /upload/ {
        alias /opt/campus-venue/data/upload/;
    }

    # ---------- 健康检查 ----------
    location = /health { proxy_pass http://127.0.0.1:8080/actuator/health; }
}
