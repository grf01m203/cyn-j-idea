# Nginx 配置：CampusVenue 生产部署
# 放置位置：/etc/nginx/conf.d/campus-venue.conf
# 替换 venue.example.com 为实际域名；证书可用 Let's Encrypt（certbot）或云厂商免费证书。

server {
    listen 80;
    server_name venue.example.com;
    # 允许 ACME 校验后跳转 HTTPS
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name venue.example.com;

    ssl_certificate     /etc/letsencrypt/live/venue.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/venue.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    client_max_body_size 10m;
    access_log /var/log/nginx/campus-venue.access.log;
    error_log  /var/log/nginx/campus-venue.error.log;

    # ---------- 学生端 H5（uni-app 构建产物） ----------
    root /var/www/campus-venue/h5;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- 管理端（Vue3 构建产物，子路径部署） ----------
    location /admin/ {
        alias /var/www/campus-venue/admin/;
        try_files $uri $uri/ /admin/index.html;
    }

    # ---------- 后端 API ----------
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ---------- WebSocket（多端实时消息） ----------
    location /ws/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_read_timeout 3600s;
    }

    # ---------- 接口文档（对外演示时可关闭） ----------
    location /doc.html   { proxy_pass http://127.0.0.1:8080; }
    location /webjars/   { proxy_pass http://127.0.0.1:8080; }
    location /v3/api-docs { proxy_pass http://127.0.0.1:8080; }

    # ---------- 上传文件（本地磁盘方案） ----------
    location /upload/ {
        alias /opt/campus-venue/data/upload/;
        expires 7d;
    }

    # 健康检查（供云监控/负载均衡使用）
    location = /health { proxy_pass http://127.0.0.1:8080/actuator/health; }
}
