server:
  # 标准开发端口 8080；若被其它进程占用，可用 --server.port=8081 覆盖启动
  port: 8080

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/campus_venue?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: campus
    password: Campus@2026
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 10000
      pool-name: CampusVenueHikari

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    com.campus.venue: debug
